name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request supersedes its run before it: macOS runners are scarce account-wide, and runs
# for stale commits queued every newer one behind them. main never cancels: every merge keeps its own result,
# so the merge that turns main red is known.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run on ubuntu only, so they are not queued behind the macOS runners; main runs both,
        # so a macOS-only failure still surfaces on the merge that caused it.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # The base the gate needs: a PR's head, or the tip a push replaces.
          # A depth-1 checkout holds neither.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # Both workspace members must resolve from the committed lockfile, on every matrix entry.
      - name: resolve the workspace
        run: uv sync --frozen --all-packages --dry-run
      # Both members: the runtime's console scripts and the orchestrator's contracts are installed.
      - run: uv sync --frozen --all-packages
      # The whole suite, in parallel: the fast suite (`uv run pytest`) is the unit tests alone.
      - run: uv run pytest -n 4
      # Every spec requirement has a tagged test, and every tag names a requirement.
      - run: python3 scripts/spec_coverage.py
      # The one lint gate: style and the PLR09 size limits (pyproject.toml). An existing offender
      # carries its own `# noqa` at its def or class line, so no number is stored here.
      - name: ruff check
        run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check packages/ tests/test_workspace_isolation.py
      # The runtime wheel must stand alone: no orchestrator dependency may leak into it.
      - name: the runtime wheel stands alone
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist" packages/agent-runtime
          uv build --wheel --out-dir "$RUNNER_TEMP/dist" packages/agent-orchestrator
          uv venv "$RUNNER_TEMP/runtime-only"
          uv pip install --python "$RUNNER_TEMP/runtime-only/bin/python" --no-deps \
            "$RUNNER_TEMP"/dist/agent_runtime-*.whl
          "$RUNNER_TEMP/runtime-only/bin/python" -c "import agent_runtime.agent_runtime, agent_runtime.mcp_server"
          if "$RUNNER_TEMP/runtime-only/bin/python" -c "import pydantic"; then
            echo "::error::pydantic leaked into the runtime environment"
            exit 1
          fi
          if "$RUNNER_TEMP/runtime-only/bin/python" -c "import yaml"; then
            echo "::error::PyYAML leaked into the runtime environment"
            exit 1
          fi
          "$RUNNER_TEMP/runtime-only/bin/agent-runtime" --help > /dev/null

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh scripts/*.sh bin/*
