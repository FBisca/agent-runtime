name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # Both workspace members must resolve from the committed lockfile, on every matrix entry.
      - name: resolve the workspace
        run: uv sync --frozen --all-packages --dry-run
      - run: uv sync --frozen
      # The whole suite, in parallel: the fast suite (`uv run pytest`) is the unit tests alone.
      - run: uv run pytest -n 4
      # The legacy tree is not lint-clean yet. The gate tracks the debt instead of hiding it:
      # a diagnostic above the budget fails the build, a diagnostic below it does not.
      - name: ruff check (legacy budget)
        env:
          RUFF_CHECK_BUDGET: "60"
        run: |
          uv run ruff check . --output-format concise > "$RUNNER_TEMP/ruff-check.txt" || true
          found=$(grep -cE '^[^ ]+:[0-9]+:[0-9]+: ' "$RUNNER_TEMP/ruff-check.txt" || true)
          echo "ruff diagnostics: $found (budget $RUFF_CHECK_BUDGET)"
          if [ "$found" -gt "$RUFF_CHECK_BUDGET" ]; then
            echo "::error::the ruff diagnostics grew: $found is above the budget $RUFF_CHECK_BUDGET"
            cat "$RUNNER_TEMP/ruff-check.txt"
            exit 1
          fi
      - name: ruff format (legacy budget)
        env:
          RUFF_FORMAT_BUDGET: "38"
        run: |
          uv run ruff format --check . > "$RUNNER_TEMP/ruff-format.txt" || true
          found=$(grep -oE '^[0-9]+ files would be reformatted' "$RUNNER_TEMP/ruff-format.txt" | grep -oE '^[0-9]+' || echo 0)
          echo "ruff format: $found files would be reformatted (budget $RUFF_FORMAT_BUDGET)"
          if [ "$found" -gt "$RUFF_FORMAT_BUDGET" ]; then
            echo "::error::the ruff format debt grew: $found is above the budget $RUFF_FORMAT_BUDGET"
            cat "$RUNNER_TEMP/ruff-format.txt"
            exit 1
          fi
      # The new modules are clean by contract; the legacy diagnostics only have to stay under budget.
      - name: ty (new modules clean, legacy budget)
        env:
          TY_BUDGET: "336"
        run: |
          uv run ty check packages/ tests/test_workspace_isolation.py
          uv run ty check --output-format concise . > "$RUNNER_TEMP/ty.txt" || true
          found=$(grep -cE ': (error|warning|info)\[' "$RUNNER_TEMP/ty.txt" || true)
          echo "ty diagnostics: $found (budget $TY_BUDGET)"
          if [ "$found" -gt "$TY_BUDGET" ]; then
            echo "::error::the ty diagnostics grew: $found is above the budget $TY_BUDGET"
            cat "$RUNNER_TEMP/ty.txt"
            exit 1
          fi
      # The runtime wheel must stand alone: no orchestrator dependency may leak into it.
      - name: the runtime wheel stands alone
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/dist" packages/agent-runtime
          uv build --wheel --out-dir "$RUNNER_TEMP/dist" packages/agent-orchestrator
          uv venv "$RUNNER_TEMP/runtime-only"
          uv pip install --python "$RUNNER_TEMP/runtime-only/bin/python" --no-deps \
            "$RUNNER_TEMP"/dist/agent_runtime-*.whl
          "$RUNNER_TEMP/runtime-only/bin/python" -c "import agent_runtime, mcp_server"
          if "$RUNNER_TEMP/runtime-only/bin/python" -c "import pydantic"; then
            echo "::error::pydantic leaked into the runtime environment"
            exit 1
          fi
          if "$RUNNER_TEMP/runtime-only/bin/python" -c "import yaml"; then
            echo "::error::PyYAML leaked into the runtime environment"
            exit 1
          fi
          "$RUNNER_TEMP/runtime-only/bin/agent-runtime" --help > /dev/null

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh bin/*
