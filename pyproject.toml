[project]
name = "agent-runtime-workspace"
version = "0.1.0"
description = "The virtual root of the uv workspace: the runtime and the orchestrator members, plus the shared toolchain."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# The root is a workspace, not a distribution: the installable members live under `packages/`.
[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/agent-runtime", "packages/agent-orchestrator", "packages/agent-eval"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
    "ty>=0.0.1a1",
    # The orchestrator member's dependencies: the development environment resolves both members,
    # while the runtime wheel stays standard-library only.
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "pytest-impacted>=0.37.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "acceptance", "packages/agent-orchestrator/tests", "packages/*/acceptance", "packages/agent-eval/tests"]
# A promoted acceptance file imports its package's helpers (`fixtures`) as the package's own tests do; the root
# package's acceptance/ imports the root tests/ the same way.
pythonpath = ["packages/agent-orchestrator/tests", "tests"]
# `-q` keeps the output readable; `--strict-markers` turns an unknown marker into an error.
addopts = "-q --strict-markers"
markers = [
    "unit: pure logic, no subprocess and no server (the fast suite)",
    "integration: drives the server over stdio, a subprocess or the filesystem",
    "live: touches a real CLI or provider; skipped unless its opt-in variable is set",
]
filterwarnings = ["default::pytest.PytestUnhandledThreadExceptionWarning"]
# The affected check tier (`pytest --impacted`, .orchestrate/config.yaml). The tests load server/
# and hooks/ by path and the packages by their installed names, so import analysis selects no
# test for a source change: the map routes each root to its tests. Its globs are right-anchored
# and `*` is one segment, so a deeper file needs its own glob; test_check_tiers_repo checks
# every tracked source file is covered.
impacted_module = "server"
impacted_map = [
  "server/*=tests",
  "hooks/*=tests",
  "bin/*=tests",
  "scripts/*=tests/installer",
  "install.sh=tests/installer",
  "herdr/*/*=tests/test_workbench_mod.py",
  "herdr/*/*/*=tests/test_workbench_mod.py",
  "herdr/*/*/*/*=tests/test_workbench_mod.py",
  "herdr/*/*=tests/installer/test_herdr.py",
  "herdr/*/*/*=tests/installer/test_herdr.py",
  "herdr/*/*/*/*=tests/installer/test_herdr.py",
  "packages/agent-runtime/src/*/*=tests",
  "packages/agent-orchestrator/src/*/*=packages/agent-orchestrator/tests",
  "packages/agent-eval/src/*/*=packages/agent-eval/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# The legacy tree is not ruff-clean yet; the gate tracks the legacy budget, it does not hide it.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# The legacy tree predates the workspace: keep the gate honest about the members, not about the past.
"server/*" = ["E402", "F401"]
"hooks/*" = ["E402", "F401"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.11"
# Check every platform: the legacy budget must not depend on the runner OS.
python-platform = "all"
# The acceptance tests import the test helpers of the suite they moved out of, as pytest lets them.
extra-paths = ["packages/agent-orchestrator/tests", "tests"]

# An acceptance file is promoted byte-identical to its approval and is never edited after, so its fixture
# subclasses may override a helper with the plan's own signature.
[[tool.ty.overrides]]
include = ["packages/*/acceptance/**", "acceptance/**"]

[tool.ty.overrides.rules]
invalid-method-override = "ignore"

# The orchestrator audit's outcome oracle was placed in the unit suite, before oracles moved to acceptance/. It is
# promoted byte-identical too, and its fixture mixins reach the RunFixture attributes only through the class they are
# mixed into, which ty cannot see.
[[tool.ty.overrides]]
include = ["packages/agent-orchestrator/tests/test_orchestrator_audit_outcome.py"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
