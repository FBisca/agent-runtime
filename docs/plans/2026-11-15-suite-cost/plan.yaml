schema: plan/1
slug: suite-cost
goal: >-
  A test that costs the suite is measured, reported and gated: the worker reads the tdd skill and
  reports its tests' seconds, the reviewer blocks a material slowdown, the fast suite stays under
  three seconds and CI refuses a module that grew past its committed baseline.
spec: docs/specs/python-workspace-contracts.md
domain: suite
archive: promote
outcome: [S2, S4]
scenarios:
  - id: S1
    when: >-
      a test starts a child process and a test asserts the ledger's busy deadline
    then: >-
      the child is killed and reaped in one cleanup, so the test pays no sleep, and the deadline is
      injected through the environment instead of the real 60 seconds, while the default stays 60
  - id: S2
    when: >-
      a YAML plan's worker changes a test it covers in `covers`
    then: >-
      its packet names the `tdd` skill and its admission and cost rules, its report carries
      `test_cost` with the `--durations` command, each touched test file's seconds and each covered
      node's seconds, and verify refuses the report without those rows
    evidence:
      human: >-
        a person reads a worker's task.md and a refused report from a ticket whose diff changes a
        covered test, and confirms the skill path, the inline rules and the named rows
  - id: S3
    when: >-
      a reviewer reviews a diff that adds or changes tests
    then: >-
      its brief runs the `test_cost` command or its own `--durations` profile and treats a new or
      changed test over two seconds, or a module that grew materially without a new boundary, as a
      blocking defect naming the node, its seconds and the cheaper level
  - id: S4
    when: >-
      the fast suite runs
    then: >-
      pytest reports under three seconds and no unit test costs half a second or more
    evidence:
      human: >-
        a person runs `uv run pytest` and `uv run pytest -m "not integration" --durations=0` and
        confirms the report line and every unit test's call time
  - id: S5
    when: >-
      CI runs the whole suite
    then: >-
      it writes the junit and fails the build naming each module that grew past its baseline times
      the tolerance plus the floor
tickets:
  - id: T1
    delivers: >-
      Cleanup kills and reaps in one step; the ledger deadline reads a test seam and keeps 60 by
      default.
    satisfies: [S1]
    paths: [tests/test_dispatch.py, packages/agent-orchestrator/src/agent_orchestrator/ledger.py, packages/agent-orchestrator/tests/test_ledger.py, packages/agent-orchestrator/tests/test_orchestrator_audit_outcome.py]
    size: regular
    difficulty: simple
  - id: T2
    delivers: >-
      The packet names the tdd skill and the test_cost schema; verify refuses a changed covered test
      without its measured seconds.
    satisfies: [S2]
    paths: [packages/agent-orchestrator/src/agent_orchestrator/contracts.py, packages/agent-orchestrator/src/agent_orchestrator/driver.py, packages/agent-orchestrator/src/agent_orchestrator/verify.py, packages/agent-orchestrator/tests/test_contracts.py, packages/agent-orchestrator/tests/test_verify.py]
    size: regular
    difficulty: complex
  - id: T3
    delivers: >-
      The reviewer's pass measures test cost and blocks a material slowdown.
    satisfies: [S3]
    paths: [packages/agent-orchestrator/src/agent_orchestrator/driver.py, packages/agent-orchestrator/tests/test_review_brief.py]
    size: small
    difficulty: simple
  - id: T4
    delivers: >-
      The fast suite's time and every unit test's cost are checked, and CI's junit is compared with a
      committed per-module baseline.
    satisfies: [S4, S5]
    paths: [acceptance/suite/test_fast_suite.py, acceptance/suite/suite_budget.json, scripts/suite_budget.py, tests/test_suite_budget.py, .github/workflows/ci.yml, pyproject.toml, packages/agent-orchestrator/tests/test_engine_home.py, packages/agent-orchestrator/tests/test_spec_citations.py, packages/agent-orchestrator/tests/test_fake_gh.py, packages/agent-orchestrator/tests/fake_gh.py]
    size: regular
    difficulty: simple
