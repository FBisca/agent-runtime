schema: plan/1
slug: lead-decision-gates
goal: >-
  A Lead's answer is applied by the driver that asked for it, a plan whose only
  proof of a scenario is a person's ticket is refused before it runs, and the
  archive never opens a pull request the plan's acceptance does not allow.
spec: docs/specs/orchestrator-engine.md
domain: driver
archive: promote
outcome: [S1, S4, S6, S7]
scenarios:
  - id: S1
    when: "the Lead answers an open request"
    then: >-
      the decision is written in the contract version of the request it answers,
      so the driver that wrote the request reads it
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S1 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
  - id: S2
    when: >-
      the Lead answers with `decide --json` and the decision names a contract
      version the request does not carry
    then: >-
      the decision is refused naming both versions and the way out, and nothing
      is written
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S2 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
  - id: S3
    when: "the driver reads a decision whose contract version it does not read"
    then: >-
      it asks the Lead again naming the reason and the way out (restart the
      driver on the current code), and applies no decision
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S3 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
  - id: S4
    when: >-
      `plan check` reads a plan in which a scenario carries no evidence and
      every ticket that satisfies it is person-owned
    then: >-
      it refuses naming the scenario, the tickets that satisfy it and every way
      out (attach `human` evidence, let an agent ticket satisfy it, or record a
      node with `complete --cover`), and writes no approval
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S4 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
  - id: S5
    when: >-
      `plan check` reads a plan in which an agent ticket satisfies the scenario,
      or the person-only scenario carries `human` evidence
    then: "it accepts the plan"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S5 or control" --junitxml="$EEC_JUNIT"
      baseline: pass
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
  - id: S6
    when: >-
      the Lead answers the archive unit with `retry` while the plan's state is
      neither ACCEPTED nor ACCEPTED_WITH_HUMAN
    then: >-
      the decision is refused naming the state and the way out, the request
      stays open and no decision is written
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S6 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
  - id: S7
    when: >-
      the driver applies a `retry` for the archive unit while the plan's
      state is neither ACCEPTED nor ACCEPTED_WITH_HUMAN
    then: >-
      it builds no archive for that retry, opens no pull request for it, and
      books a request for the Lead naming the state and the way out
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/driver/test_decision_gates.py
        -q -k "S7 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_decision_gates.py]
      package: packages/agent-orchestrator
      timeout: 900
tickets:
  - id: T1
    delivers: >-
      A decision answers the request it was asked in: the decision carries the
      request's own contract version, `decide --json` refuses a version the
      request does not carry, and a driver that meets a decision it cannot read
      names the restart as the way out
    satisfies: [S1, S2, S3]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/src/agent_orchestrator/contracts.py
      - packages/agent-orchestrator/tests/test_decide_contract.py
      - packages/agent-orchestrator/tests/test_decide_json.py
      - packages/agent-orchestrator/tests/test_decider.py
    size: regular
    difficulty: complex
    risk: [state]
  - id: T2
    delivers: >-
      `plan check`, `plan approve` and `plan amend` refuse a scenario that
      carries no evidence and that only person-owned tickets satisfy, naming the
      scenario, the tickets that satisfy it and the way out
    satisfies: [S4, S5]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/plan.py
      - packages/agent-orchestrator/tests/test_plan_lint.py
      - packages/agent-orchestrator/tests/test_plan_lint_rules.py
      - packages/agent-orchestrator/tests/data/reference.plan.yaml
    size: regular
    difficulty: simple
  - id: T3
    delivers: >-
      The archive waits for an accepted plan: the Lead's `retry` for the archive
      is refused while the plan is not accepted, and the driver builds no
      archive while the plan is rejected
    satisfies: [S6, S7]
    blocked_by: [T1]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/test_archive_driver.py
      - packages/agent-orchestrator/tests/test_acceptance.py
    size: regular
    difficulty: complex
    risk: [state, retry-idempotency]
