schema: plan/2
slug: 04-agent-review-evaluation
goal: 'A frozen reference set of real changes, split before any threshold is chosen, decides whether the screening gate is
  fit to ship: a missed known-bad change fails acceptance, the clean-change escalation rate is reported against its ceiling,
  and the cost of every review is stated.'
spec: docs/specs/agent-review.md
archive: discard
requirements:
  added:
  - title: Benchmark over a frozen reference set
    shall: The benchmark SHALL replay a frozen reference set, report each case's decision and judgments, and refuse to measure
      when the bank or calibration moved after the split.
    scenarios:
    - id: S1
      when: a benchmark runs over a frozen reference set
      then: it reports, per case, the escalation decision, the kind the case carries, and the judgments behind the decision,
        and a summary naming the calibration split it used
    - id: S2
      when: the bank, the thresholds or the calibration changed after the split was fixed
      then: the benchmark refuses to measure and names the digest that moved, instead of reporting a result
  - title: Acceptance on the escalation action
    shall: Acceptance SHALL fail on a missed known-bad case and report each case's cost and latency.
    scenarios:
    - id: S3
      when: the run missed a case the reference set records as bad
      then: acceptance fails naming the case, and a run with no miss passes while still reporting the clean changes it escalated
    - id: S4
      when: each case is screened
      then: the benchmark reports the requests, the tokens, the cost from the declared table and the latency per case, so
        a screening that costs as much as a deep review cannot pass unnoticed
tickets:
- id: T1
  delivers: Replay a frozen reference set through the existing CLI, report per-case decisions and judgments, and refuse to
    measure when the bank or the calibration moved after the split was fixed
  satisfies:
  - S1
  - S2
  paths:
  - packages/agent-review/
  - packages/agent-eval/
  size: regular
  difficulty: complex
  risk:
  - state
- id: T2
  delivers: 'Decide acceptance on the escalation action: a missed known-bad case fails, a clean-change escalation rate is
    reported against its declared ceiling, and cost and latency are reported per case from the provider''s usage and the price
    table'
  satisfies:
  - S3
  - S4
  paths:
  - packages/agent-review/
  blocked_by:
  - T1
  size: regular
  difficulty: simple
  risk:
  - external
