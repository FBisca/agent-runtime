schema: plan/1
slug: orchestrator-pr-merge-state
goal: >-
  The driver watches a unit's pull request merge state and checks from ready-for-ci until the merge: a conflicting PR
  goes back to draft and gets a conflict fix round, a PR behind its base is updated, red checks get a CI fix round,
  and an unknown state is polled again. A PR is never left waiting for a merge it cannot get.
spec: docs/specs/orchestrator-engine.md
outcome: [S1]

scenarios:
  # The incident: a PR that conflicts while it waits for its merge
  - id: S1
    when: a unit is at awaiting-merge and its pull request turns DIRTY or CONFLICTING
    then: >-
      the PR goes back to draft, a conflict fix round gives a fresh worker a rebase brief that quotes the `gh pr view`
      merge state, the result goes through a delta re-review and CI, and `gh pr ready` runs again before the unit is
      back at awaiting-merge
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_pr.py -m integration
        -k "MergeStateTests and S1_" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      timeout: 300
  - id: S2
    when: a unit at ready-for-ci has a DIRTY or CONFLICTING pull request, whatever its checks say
    then: >-
      `gh pr ready` and `gh pr update-branch` are not called; the PR stays a draft and the conflict fix round is raised
      directly
  - id: S3
    when: a unit is at ready-for-ci or awaiting-merge and its pull request is BEHIND its base
    then: >-
      `gh pr update-branch` runs, the unit is at ready-for-ci with its checks cleared, the PR stays ready (no draft
      undo, no fix round), and once checks polled after the update are green a new pr-ready wake is sent, keyed on the
      PR's new head (`headRefOid`)
  - id: S4
    when: the merge state is UNKNOWN, or `gh pr view` fails, at ready-for-ci or awaiting-merge
    then: no `gh pr ready`, no wake and no fix round; the unit is polled again on a later round
  - id: S5
    when: a unit is at awaiting-merge and its checks turn red
    then: the PR goes back to draft and a CI fix round is raised with the failed check log
  - id: S6
    when: a unit is at awaiting-merge with merge state CLEAN, BLOCKED, UNSTABLE or HAS_HOOKS and checks green or pending
    then: it keeps waiting with no mutating `gh` call, and the idle ticks still skip it (R15)
  - id: S7
    when: a pull request is MERGED or CLOSED while also DIRTY, BEHIND or red
    then: the merge or close handling wins and no fix round is raised
  - id: S8
    when: a disputed answer with changes_code moves a unit out of ready-for-ci or awaiting-merge
    then: the PR goes back to draft, its checks state is cleared, and `gh pr ready` runs again when it returns
  - id: S9
    when: "`gh pr ready --undo` fails while a unit leaves awaiting-merge for a fix round"
    then: no fix worker is dispatched; the undo is retried on a later round and the failure is logged
  - id: S10
    when: "`gh pr update-branch` exits non-zero and a fresh `gh pr view` does not show DIRTY or CONFLICTING"
    then: >-
      no conflict fix round is raised; the Lead is asked with the gh error and the way out (fix access or update the
      branch by hand, then `decide`)
  - id: S11
    when: a unit's pull request conflicts again after its fix rounds hit the cap
    then: the unit escalates to the Lead as other capped rounds do, and its PR stays a draft
  - id: S12
    when: the archive unit's pull request turns DIRTY
    then: >-
      its conflict fix round goes fix, converge --final, ready-for-ci with no review, and no path reads a missing
      reviewed_commit

tickets:
  - id: T1
    delivers: >-
      One merge-state step shared by ready-for-ci and awaiting-merge (precedence MERGED/CLOSED, DIRTY, UNKNOWN,
      BEHIND, checks); `headRefOid` in `pr view` and the pr-ready wake key; one draft-undo helper for every
      code-changing exit that clears pr_ready and draft flags across the unit; update-branch failure split from
      conflict; the fake gh scripting merge state and head while draft; the tests; R23+ in the spec (R22 is claimed by orchestrator-silent-idle)
    satisfies: [S1, S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S12]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/test_pr.py
      - packages/agent-orchestrator/tests/fake_gh.py
      - packages/agent-orchestrator/tests/fixtures.py
      - packages/agent-orchestrator/tests/test_fake_gh.py
      - packages/agent-orchestrator/tests/test_envelope.py
      - packages/agent-orchestrator/tests/test_archive.py
      - docs/specs/orchestrator-engine.md
      - docs/plans/2026-11-10-orchestrator-pr-merge-state.plan.yaml
      - docs/plans/2026-11-10-orchestrator-pr-merge-state.plan.md
    size: regular
    difficulty: complex
    risk: [state, external]
