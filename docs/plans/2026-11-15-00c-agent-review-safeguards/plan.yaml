schema: plan/1
slug: 00c-agent-review-safeguards
goal: >-
  A change that a deterministic rule can refuse is escalated before the model is asked, naming the rule and the
  path it matched, so the gate's decision rests on a fact about the diff rather than on a threshold.
spec: docs/specs/agent-review.md
domain: safeguards
archive: promote
outcome: [S1, S3, S6, S8]
scenarios:
  - id: S1
    when: >-
      a change adds a destructive call - a delete or an overwrite - on a target the change computes rather than
      spells out, and adds no containment test for it (the archive driver's unguarded
      `shutil.rmtree(self.plan_path.parent)`, `429625b`)
    then: >-
      the execution completes with the verdict `escalated`, exactly one escalation reason names the rule
      `target-outside-root` and the changed path, `judgments` is empty, and `usage.requests` is zero because the
      provider was never asked
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S1 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S2
    when: >-
      a change adds a destructive call on a computed target and confines it with a containment test in the same
      change, or adds no destructive call at all (the fix `109c98b`)
    then: >-
      no `target-outside-root` reason appears and the screening proceeds through the canned provider
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S2 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S3
    when: >-
      a changed path matches a mandatory baseline pattern, as an added, modified or deleted file, or on either
      side of a rename
    then: >-
      the report carries one `protected-path` reason per matched change, naming the changed path, the pattern it
      matched and `source: baseline`
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S3 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S4
    when: "a change touches only paths that match no baseline or repository pattern, including a near miss under a matching directory"
    then: >-
      no `protected-path` reason appears and the report is written with the verdict `screened`
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S4 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S5
    when: "a repository ships `.agent-review.yaml` naming its own sensitive paths, discovered without a flag"
    then: >-
      the run is `escalated` with `usage.requests: 0`, a change to a matching path carries `source: repository`
      while a baseline path still carries `source: baseline`: the repository's list extends the mandatory baseline
      instead of replacing it
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S5 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S6
    when: "a member the rule set declares standard-library-only adds an import outside the standard library"
    then: >-
      the report carries a `stdlib-only` reason naming the member's path and the imported module, and no request
      is made
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S6 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S7
    when: >-
      a declared standard-library-only member adds a standard-library import, or a member no declaration covers
      adds a third-party one
    then: "no `stdlib-only` reason appears and the screening proceeds"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S7 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S8
    when: "a safeguard fires"
    then: >-
      report.json is written with `status: completed`, `verdict: escalated` and no judgments, the command exits 0,
      and the terminal summary names the rule, the path it matched and what a person should do about it
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S8 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S9
    when: "a configuration's `sensitive_paths` is not a list of patterns, or `safeguards.stdlib_only` is not a list of paths"
    then: >-
      the configuration is refused before any change is read, naming the field by its path, writing no report and
      exiting 2
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/safeguards/test_safeguards_cli.py -q -k "S9 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_safeguards_cli.py]
      package: packages/agent-review
      timeout: 600
tickets:
  - id: T1
    delivers: >-
      Read the change as paths and hunks beside the frozen diff, decide the `target-outside-root` rule from it,
      and carry the verdict `escalated` with one reason per rule and path into report.json and the summary,
      spending no request
    satisfies: [S1, S2, S8]
    paths: [packages/agent-review/]
    size: regular
    difficulty: complex
    risk: [security]
  - id: T2
    delivers: >-
      Ship the mandatory sensitive-path baseline with the configuration that extends it, discover `.agent-review.yaml`
      instead of requiring a flag, decide `protected-path` from every changed path including both sides of a rename,
      and refuse a malformed rule configuration by field path
    satisfies: [S3, S4, S5, S9]
    paths: [packages/agent-review/]
    blocked_by: [T1]
    size: regular
    difficulty: complex
    risk: [security, state]
  - id: T3
    delivers: >-
      Declare which members may carry only the standard library and decide `stdlib-only` from the modules a change
      imports, with no request spent when it fires
    satisfies: [S6, S7]
    paths: [packages/agent-review/]
    blocked_by: [T1]
    size: small
    difficulty: simple
    risk: [security]
