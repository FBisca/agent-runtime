schema: plan/1
slug: 01-score-levels-are-bands
goal: >-
  A score answer on a declared ladder is the provider's own number anywhere between the first and the last rung, carried
  into the judgment unchanged, while an answer off the ladder is still refused naming the question: the contract measures
  where on the ladder a change sits, and never snaps it to a rung.
spec: docs/specs/agent-review.md
domain: screening
archive: promote
outcome: [S1]
scenarios:
  - id: S1
    when: "a score question declares a ladder of levels and the provider answers a number between its first and last rung"
    then: >-
      the judgment carries that number as the provider answered it and the screening completes, while an answer below the
      first rung or above the last is refused naming the question and the range the ladder allows, so the ladder bounds
      the answer without snapping it to a rung
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/screening/test_score_ladder.py -q -k "S1 or control"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_score_ladder.py]
      package: packages/agent-review
      timeout: 600
tickets:
  - id: T1
    delivers: >-
      Bound a score by its ladder instead of snapping it to a rung: a finite number from 0 to one less than the declared
      levels is the provider's answer and travels into the judgment unchanged, an answer off that range is refused
      naming the question and the range, and the promoted provider-contract node that pinned the rung reading follows
      the same rule
    satisfies: [S1]
    paths: [packages/agent-review/]
    size: small
    difficulty: simple
    risk: [state]
