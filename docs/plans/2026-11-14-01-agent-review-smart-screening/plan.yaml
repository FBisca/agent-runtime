schema: plan/1
slug: 01-agent-review-smart-screening
goal: >-
  A screening asks the whole calibrated bank of a chunk in one request, reads the provider's confidence beside each
  answer, and tells a caller whether this change should be escalated — with the repository's own questions and its
  safeguard paths extending the baseline rather than replacing it.
spec: docs/specs/agent-review.md
domain: screening
archive: promote
outcome: [S1, S2, S3, S4, S5, S6]
scenarios:
  - id: S1
    when: "a repository provides `.agent-review.yaml` or a caller specifies `--config`"
    then: "its questions extend the mandatory baseline without replacing it, a score question carries its levels, and the screening's weights, per-question thresholds and calibration are declared in configuration rather than chosen by the model"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_smart_screening_cli.py
        -q -k "S1 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_smart_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S2
    when: "a changed file, directory, or either side of a rename matches a global or repository sensitive path"
    then: "the outcome recommends full deep review with a reason naming the pattern and whether it came from the baseline or the repository"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_smart_screening_cli.py
        -q -k "S2 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_smart_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S3
    when: "a change is larger than one request's token budget"
    then: "deterministic file and hunk chunks are built within the budget in force, each chunk is screened once with the whole bank, every changed region is carried by exactly one chunk, and the report counts the requests actually made"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_smart_screening_cli.py
        -q -k "S3 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_smart_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S4
    when: "a question needs a file the chunk does not carry, and the change is wider than the cross-file limit"
    then: "the report records the coverage gap with its reason and recommends full deep review rather than reading the screen as complete"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_smart_screening_cli.py
        -q -k "S4 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_smart_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S5
    when: "a critical or high judgment falls below its question's calibrated threshold, or its confidence falls below that question's declared band"
    then: "the tool records an escalation signal with the question, the scope, the value, the confidence and the rule that fired, and never converts a raw probability into a calibrated confidence"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_smart_screening_cli.py
        -q -k "S5 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_smart_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S6
    when: "a screening completes and a price table names the model the provider served"
    then: "the report carries the cost from that table with its basis, and an unlisted model is unknown rather than zero"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_smart_screening_cli.py
        -q -k "S6 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_smart_screening_cli.py]
      package: packages/agent-review
      timeout: 600
tickets:
  - id: T1
    delivers: "Merge repository questions, levels and safeguard paths into the mandatory baseline as additive configuration, and declare weights, per-question thresholds and calibration beside the bank"
    satisfies: [S1, S2]
    paths: [packages/agent-review/]
    size: regular
    difficulty: complex
    risk: [state]
  - id: T2
    delivers: "Chunk the diff deterministically inside the token budget in force, screen each chunk once with the whole bank, prove total coverage of the changed regions, and record a cross-file coverage gap instead of a clean screen"
    satisfies: [S3, S4]
    paths: [packages/agent-review/]
    blocked_by: [T1]
    size: regular
    difficulty: complex
    risk: [state]
  - id: T3
    delivers: "Emit escalation signals from calibrated thresholds and per-question confidence bands, and price the screening from a declared table naming the model the provider served"
    satisfies: [S5, S6]
    paths: [packages/agent-review/]
    blocked_by: [T2]
    size: regular
    difficulty: simple
    risk: [external]
