schema: plan/1
slug: plan-layout
goal: >-
  A plan lives in its own folder with its acceptance tests, a repo config names where plans live and how they
  archive, and archive either promotes the acceptance tests into `<package>/acceptance/<domain>/` or discards the
  plan without touching the repository; legacy plans keep working.
spec: docs/specs/plan-contract.md
outcome: [S2, S10, S11, S12]

scenarios:
  # Config and discovery
  - id: S1
    when: '`<repo>/.orchestrate/config.yaml` is read by any command (plans list, plan check, approve, run, status, verify)'
    then: >-
      its nodes `plans.dir`, `acceptance.dir` and `archive.mode` (promote | discard) are applied; a relative path is
      under the repo root, `~` and absolute paths are allowed; an unknown key or a bad mode is refused naming its
      dotted path and the fix; a missing file means docs/plans, acceptance and promote; nothing else is read
  - id: S2
    when: '`plans list --json` runs in a repo whose config names a plans dir, inside or outside the repository, tracked or not'
    then: >-
      it lists each `<dir>/<folder>/plan.yaml` from the filesystem with its slug, beside the legacy plans it lists
      today; an unknown config key fails the command naming it; no directory or file is created
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_plan_layout.py -m integration
        -k "ConfiguredDiscovery or control" -q --junitxml="$EEC_JUNIT"
      oracle: [test_plan_layout.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 600

  # The folder contract
  - id: S3
    when: '`plan check` reads a plan.yaml in its own folder'
    then: >-
      evidence takes `acceptance: [files]` (in `<folder>/acceptance/`), `package: <dir | .>` and `negative:`
      (relative to the folder); top-level `domain:` (a `[a-z0-9-]+` slug) and `archive: promote | discard` are
      accepted; `oracle`, `place` and `promote` are refused in a folder plan naming the new key
  - id: S4
    when: '`plan check` reads a folder plan that promotes'
    then: >-
      it refuses, each named with its YAML path and fix: no `domain`; a missing acceptance or negative file; a
      `package` outside the repository; an acceptance file whose basename matches a test module already in that
      package or whose destination `<package>/<acceptance.dir>/<domain>/<file>` exists. A discard plan needs
      neither `spec` nor `domain`
  - id: S5
    when: 'a folder plan is approved and afterwards a file in its acceptance/ or negatives/ is added, edited or removed'
    then: >-
      approve digests the plan and every acceptance and negative file, snapshots them under the state dir, and
      `plan check` and `run` refuse the change naming the file and `plan approve`; `plan schema` describes the new
      keys
  - id: S6
    when: 'an evidence item of a folder plan runs'
    then: >-
      the runner places each acceptance file at `<package>/<acceptance.dir>/<domain>/<file>` in the scratch tree
      before the check runs, and the receipt records each file's sha256
  - id: S7
    when: 'a ticket of a folder plan touches its plan folder or an acceptance destination'
    then: 'verify fails the gate naming the file and the integrity rule; the workbench reports an edited acceptance file as drift'

  # Archive
  - id: S8
    when: 'a promote plan is accepted and its archive runs'
    then: >-
      before the archive worker starts, the driver moves each acceptance file to its destination and deletes the plan
      folder in the archive tree; the worker writes the spec requirements; outcome evidence is re-run on the archive
      head from the promoted files
  - id: S9
    when: 'a discard plan is accepted'
    then: >-
      no archive worker or PR runs; the driver deletes the plan folder (with its acceptance and negatives) and marks
      the plan ARCHIVED in the ledger; a plan folder tracked in the repository is instead deleted by a one-commit PR
      that changes nothing else
  - id: S10
    when: 'a promote folder plan is approved, run, verified and archived end to end'
    then: >-
      history is APPROVED → RUNNING → DELIVERED → VERIFYING → ACCEPTED → ARCHIVED; the archive tree holds the
      acceptance file byte-identical at `acceptance/<domain>/` and no plan folder; the outcome passed on the archive
      head; `verify` exits 0
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_plan_layout.py -m integration
        -k "PromoteArchive or control" -q --junitxml="$EEC_JUNIT"
      oracle: [test_plan_layout.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 900
  - id: S11
    when: 'a discard folder plan kept outside the repository, with no spec, is approved, run and verified'
    then: >-
      the ledger reads ARCHIVED, no archive worker was spawned, the plan folder is gone, and origin's tree outside
      the ticket's paths is unchanged
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_plan_layout.py -m integration
        -k "DiscardArchive or control" -q --junitxml="$EEC_JUNIT"
      oracle: [test_plan_layout.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 900

  # Legacy and the repository
  - id: S12
    when: 'a legacy plan (`X.plan.yaml` beside `X.oracle/`, keys `oracle`/`place`/`promote`) is checked, approved, run, verified or archived'
    then: >-
      it behaves as before, with or without a repo config beside it, and is listed beside folder plans; an approval
      digest written before this plan still verifies
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_yaml_eec.py
        packages/agent-orchestrator/tests/test_plan_layout.py -m integration -k "Lifecycle or Rejections or control"
        -q --junitxml="$EEC_JUNIT"
      oracle: [test_plan_layout.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: pass
      timeout: 900
  - id: S13
    when: '`uv run pytest` runs in agent-runtime with a promoted test at `packages/agent-orchestrator/acceptance/<domain>/test_x.py` that imports `fixtures`'
    then: >-
      it is collected and imports `fixtures` from the package's tests/; the repo's `.orchestrate/config.yaml` names
      docs/plans, acceptance and promote
  - id: S14
    when: 'start-planning writes a plan in a repo with this engine'
    then: >-
      it writes `<plans.dir>/<date>-<slug>/` with plan.yaml, plan.md and acceptance/, proposes a `domain` (reusing an
      existing folder under the package's acceptance dir when one fits), formats Python acceptance files with
      `format_acceptance.py` only when the repo configures ruff, and never names oracles

tickets:
  - id: T1
    delivers: >-
      The repo config (`.orchestrate/config.yaml`, nested nodes, strict keys, defaults) and discovery of folder plans
      from the configured dir, inside or outside the repo, beside today's legacy listing
    satisfies: [S1, S2]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/config.py
      - packages/agent-orchestrator/src/agent_orchestrator/plan.py
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/test_config.py
      - packages/agent-orchestrator/tests/test_discovery.py
    size: regular
    difficulty: simple
  - id: T2
    delivers: >-
      plan/1 for folder plans: the acceptance, package, negative, domain and archive keys, their check rules, the
      digest and snapshot over acceptance and negatives, and the schema; legacy plans keep their keys and digests
    satisfies: [S3, S4, S5, S12]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/plan.py
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/test_plan.py
      - packages/agent-orchestrator/tests/test_plan_folder.py
    size: regular
    difficulty: complex
    blocked_by: [T1]
    risk: [migration]
    evidence_waiver: >-
      Legacy behaviour is S12's outcome evidence at integration (the existing yaml-eec and plan suites), and CI runs
      those suites on every PR
  - id: T3
    delivers: >-
      The runner places acceptance files at their domain destination and records their sha256; verify's integrity
      rule and the workbench's drift check cover the plan folder and the destinations
    satisfies: [S6, S7]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/runner.py
      - packages/agent-orchestrator/src/agent_orchestrator/verify.py
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/src/agent_orchestrator/workbench.py
      - packages/agent-orchestrator/tests/test_runner.py
      - packages/agent-orchestrator/tests/test_verify.py
      - packages/agent-orchestrator/tests/test_workbench.py
    size: regular
    difficulty: complex
    blocked_by: [T2]
  - id: T4
    delivers: >-
      Archive modes: promote moves the acceptance into its domain and deletes the plan folder before the archive
      worker, then re-verifies; discard deletes the plan folder with no worker (or a delete-only PR when tracked) and
      marks the plan ARCHIVED
    satisfies: [S8, S9, S10, S11]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/test_archive_yaml.py
      - packages/agent-orchestrator/tests/test_archive.py
      - packages/agent-orchestrator/tests/test_archive_modes.py
    size: regular
    difficulty: complex
    blocked_by: [T3]
    risk: [state]
  - id: T5
    delivers: >-
      agent-runtime's own `.orchestrate/config.yaml`, and the root pytest config collects each package's acceptance
      dir with that package's tests/ on the import path
    satisfies: [S13]
    paths:
      - .orchestrate/config.yaml
      - pyproject.toml
      - tests/test_acceptance_collection.py
    size: small
    difficulty: simple
  - id: T6
    delivers: >-
      agent-skills: start-planning writes folder plans with acceptance/ and a domain, format_oracle.py becomes
      format_acceptance.py (ruff-only, skipped otherwise), the plan-yaml skeleton and their tests follow
    satisfies: [S14]
    paths: [skills/start-planning/, skills/orchestrate/SKILL.md]
    owner: fbisca
    repo: ../agent-skills
    blocked_by: [T4]
