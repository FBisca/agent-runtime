schema: plan/1
slug: 00-agent-review-screening-cli
goal: "A developer can invoke a screening-only code review over Git revisions and inspect its structured, reproducible output."
spec: docs/specs/agent-review.md
domain: screening
archive: promote
outcome: [S1, S2, S3, S4]
scenarios:
  - id: S1
    when: "a caller invokes `agent-review code` on two Git revisions"
    then: "the tool evaluates a curated global engineering and contract question bank through a direct screening API"
    evidence:
      human: "Run a Git revision review using a configured real screening API; confirm the expected flags and reproducible `report.json`. Then deliberately break credentials and confirm an incomplete execution, not a clean verdict."
  - id: S2
    when: "the screening completes without requiring deep review"
    then: "the tool emits a `screened` verdict, preserves native judgments with deterministic question/revision provenance, and writes `report.json`"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_screening_cli.py -q
        -k "S2 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S3
    when: "the provider fails or returns an invalid judgment"
    then: "the execution is incomplete rather than passed, with an observable failure reason"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_screening_cli.py -q
        -k "S3 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_screening_cli.py]
      package: packages/agent-review
      timeout: 600
  - id: S4
    when: "the same frozen input and model configuration are evaluated"
    then: "the report identifies the exact revision, question configuration, model and usage measurements"
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-review/acceptance/screening/test_screening_cli.py -q
        -k "S4 or control" --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_screening_cli.py]
      package: packages/agent-review
      timeout: 600
tickets:
  - id: T1
    delivers: "Add the workspace member with its CLI entry point, the screening port with its fixture provider, and the baseline YAML question configuration; the member joins the workspace members, `testpaths`, `impacted_map` and the affected tier's source roots as `agent-eval` does"
    satisfies: [S1]
    paths:
      - packages/agent-review/
      - packages/agent-orchestrator/tests/test_check_tiers_repo.py
      - pyproject.toml
      - uv.lock
    size: regular
    difficulty: complex
    risk: [external]
    evidence_waiver: "The real provider is exercised by S1's human run, which this ticket delivers: a review of two Git revisions with configured credentials, then the same run with the credentials broken. The failure path itself is proven by S3's fixture-backed checks at T2's gate."
  - id: T2
    delivers: "Normalize bounded judgments into `report.json` with the execution status kept separate from the verdict, and expose a human-readable terminal summary"
    satisfies: [S2, S3, S4]
    paths: [packages/agent-review/]
    blocked_by: [T1]
    size: regular
    difficulty: simple
    risk: [state]
approval:
