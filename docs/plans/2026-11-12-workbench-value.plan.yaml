schema: plan/1
slug: workbench-value
goal: >-
  Opening the workbench shows a person what waits on them and the plans that are still moving, newest first, with
  each plan's run metrics and timeline, and it can expand over the terminals to the whole work area.
spec: docs/specs/agent-workbench.md
outcome: [S25, S26, S27, S28, S29, S33, S34]

scenarios:
  - id: S25
    when: "`workbench plans --json` lists a directory where a `.plan.md` has a `.plan.yaml` of the same stem"
    then: only the YAML plan is listed; a Markdown plan without a YAML twin is still listed as legacy
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_workbench_value.py -m integration
        -k "S25 or S26 or S27 or control" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      oracle: [test_workbench_value.py.oracle]
      place: packages/agent-orchestrator/tests/
  - id: S26
    when: "`workbench plans --json` lists plans in every state"
    then: >-
      each entry has `group`: `active` for RUNNING, DELIVERED, VERIFYING, APPROVED never driven, DRAFT, and a plan
      that fails to load with no ledger or a non-final ledger state; `older` for ARCHIVED, ACCEPTED*, REJECTED, a
      plan that fails to load whose ledger is final, and every Markdown-only plan
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_workbench_value.py -m integration
        -k "S25 or S26 or S27 or control" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      oracle: [test_workbench_value.py.oracle]
      place: packages/agent-orchestrator/tests/
  - id: S27
    when: "`workbench plans --json` lists plans with run events"
    then: >-
      each entry has `last_activity` (the newest `at` in its `events.jsonl`, else the plan file's mtime, else null,
      ISO 8601), and entries are ordered active before older, newest activity first, null last
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_workbench_value.py -m integration
        -k "S25 or S26 or S27 or control" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      oracle: [test_workbench_value.py.oracle]
      place: packages/agent-orchestrator/tests/
  - id: S28
    when: "`workbench plans --json` runs while active plans wait on a person"
    then: >-
      a top-level `needs_me` list holds `{plan, ticket, kind}` items for active plans only: `needs_you` (a ticket
      in state needs you), `unverified` (an unverified merge), `driver_gone` (RUNNING, last `start` pid not alive,
      no later `finish`), `error` (an error event since the last start), `ready_to_approve` (a DRAFT that loads),
      `ready_to_drive` (APPROVED never driven), `fix_plan` (fails to load), and `lead_pending` (last escalation of
      a unit with no later decision or merged stop); no escalation reason, report or message text is printed
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_workbench_value.py -m integration
        -k "S28 or control" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      oracle: [test_workbench_value.py.oracle]
      place: packages/agent-orchestrator/tests/
  - id: S29
    when: "`workbench plan <plan> --json` runs on a plan with a run directory"
    then: >-
      the view carries `run_dir` and a `metrics` block computed read-only from `events.jsonl` (and `attempts.jsonl`
      when present): `wall_seconds` (the sum of each drive from `start` to its `finish` or last event),
      `first_pass_rate`, `errors.by_gate` and `errors.last` (at most 120 characters), per ticket `elapsed_seconds`,
      `phases.work|review|ci`, `fix_rounds`, `review_rounds`, `findings`, `ci_failures` (distinct task, PR and
      gate), `escalations` by cause, `model` and `tokens` (null when unmeasured), and `timeline` segments per
      ticket; a plan never driven has null `run_dir` and `metrics`; nothing is written
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_workbench_value.py -m integration
        -k "S29 or control" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      oracle: [test_workbench_value.py.oracle]
      place: packages/agent-orchestrator/tests/
  - id: S30
    when: the workbench mod opens on a repository with plans
    then: >-
      a Needs me section on top lists the `needs_me` items with the way to act on each, then the active plans in the
      order the command printed, then one collapsed "N older" line that expands to the older plans
  - id: S31
    when: a plan with metrics is selected
    then: >-
      the plan header shows wall time, first-pass rate and driver errors, and the inspector shows the ticket's
      phase times, rounds, findings, CI failures, escalations and model; unmeasured values read as unknown, never 0
  - id: S32
    when: a plan with metrics is selected and the mod is at least the wide-layout width
    then: a timeline shows one lane per ticket with a segment per phase, in ticket order, scaled to the run's span
  - id: S33
    when: the workbench panel is showing and the person presses expand, then collapse, or closes the panel while expanded
    then: >-
      expand hides `main` and resizes the panel to weight 1; collapse shows `main` and restores the width it had
      (520 when unknown); closing while expanded shows `main` and restores the width before hiding the panel; no
      expand is offered when the panel does not show the workbench or has no terminals beside it
    evidence:
      check: node --test herdr/agent-workbench/test/expand.test.js
      baseline: fail
      oracle: [expand.test.js.oracle]
      place: herdr/agent-workbench/test/
  - id: S34
    when: the shipped workbench layout is installed
    then: its panel keeps `size.px` 520 and `min` 280 and has no `max`, so a weight-1 panel fills the work area
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_workbench_value.py -m integration
        -k "S34 or control" -q --junitxml="$EEC_JUNIT"
      baseline: fail
      oracle: [test_workbench_value.py.oracle]
      place: packages/agent-orchestrator/tests/
tickets:
  - id: T1
    delivers: "`workbench plans --json` hides Markdown twins, groups plans active or older, orders them by last activity and prints `needs_me`"
    satisfies: [S25, S26, S27, S28]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/workbench.py
      - packages/agent-orchestrator/src/agent_orchestrator/workbench_needs.py
      - packages/agent-orchestrator/tests/test_workbench.py
      - packages/agent-orchestrator/tests/test_workbench_needs.py
    size: regular
    difficulty: complex
  - id: T2
    delivers: "`workbench plan --json` carries `run_dir` and the run's metrics and timeline from its events"
    satisfies: [S29]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/workbench.py
      - packages/agent-orchestrator/src/agent_orchestrator/workbench_metrics.py
      - packages/agent-orchestrator/tests/test_workbench_metrics.py
    size: regular
    difficulty: complex
  - id: T3
    delivers: the mod opens on Needs me, the active plans and a collapsed older line
    satisfies: [S30]
    blocked_by: [T1]
    paths:
      - herdr/agent-workbench/
      - tests/test_workbench_mod.py
    size: regular
    difficulty: simple
  - id: T4
    delivers: the mod shows a plan's metrics in its header and inspector, and its timeline when wide
    satisfies: [S31, S32]
    blocked_by: [T2, T3]
    paths:
      - herdr/agent-workbench/
      - tests/test_workbench_mod.py
    size: regular
    difficulty: simple
  - id: T5
    delivers: the workbench header expands the panel over the terminals and collapses it back
    satisfies: [S33, S34]
    paths:
      - herdr/agent-workbench/model.js
      - herdr/agent-workbench/main.js
      - herdr/agent-workbench/views/
      - herdr/agent-workbench/test/
      - herdr/layouts/workbench.json
      - tests/test_workbench_mod.py
    size: small
    difficulty: simple
