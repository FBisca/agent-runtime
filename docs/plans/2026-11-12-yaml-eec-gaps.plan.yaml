schema: plan/1
slug: yaml-eec-gaps
goal: >-
  The gaps the yaml-eec review left open are closed: `plan check` enforces D14's negative control, `plan schema` and
  receipt tamper detection are pinned as requirements, attention.md stops listing finished person tickets, and the
  dead wait_checks module and the stale yaml-eec narrative are cleaned up.
spec: docs/specs/plan-contract.md
outcome: [S1, S3, S4]

scenarios:
  - id: S1
    when: >-
      `plan check` reads a plan where a risk-tagged ticket with no `evidence_waiver` satisfies a scenario whose
      `check` evidence has `baseline: pass` and no `negative`
    then: >-
      it exits 2 naming `scenarios[<i>].evidence` and the fix (add a `negative` patch that breaks the behaviour);
      the same plan with a `negative`, with `baseline: fail`, with `human` evidence, with an untagged ticket or with
      a waiver stays valid
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_yaml_eec_gaps.py -m integration
        -k NegativeRule -q --junitxml="$EEC_JUNIT"
      oracle: [test_yaml_eec_gaps.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 300
  - id: S2
    when: '`plan schema` runs'
    then: 'it prints the plan/1 JSON Schema with `additionalProperties: false` at the top level and exits 0'
  - id: S3
    when: >-
      a receipt is rewritten in place after the ledger recorded its sha256, with its digest, tree and result kept
      (what a Pi worker, which has no hooks, could do)
    then: >-
      `verify` does not count it: the item is UNKNOWN naming the scenario and that the receipt no longer matches the
      sha256 the ledger holds, and verify exits non-zero
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_yaml_eec_gaps.py -m integration
        -k ReceiptTamper -q --junitxml="$EEC_JUNIT"
      oracle: [test_yaml_eec_gaps.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: pass
      negative: ignore-receipt-sha.patch
      timeout: 600
  - id: S4
    when: 'a person ticket that read "needs you" is set COMPLETE in the ledger and the driver runs again'
    then: >-
      the driver rewrites attention.md from the ledger on every tick: the completed ticket's line is gone, a ticket
      still waiting is listed once, and a run with nothing waiting has the header only
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_yaml_eec_gaps.py -m integration
        -k AttentionRefresh -q --junitxml="$EEC_JUNIT"
      oracle: [test_yaml_eec_gaps.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 300
  - id: S5
    when: 'the agent-orchestrator package is imported or searched for `wait_checks`'
    then: '`agent_orchestrator.wait_checks` does not exist and nothing under packages/ names it'

tickets:
  - id: T1
    delivers: >-
      `plan check` refuses risk-tagged baseline-pass evidence without a `negative` (D14), with its own tests in
      test_plan.py; a dedicated test pins `plan schema`
    satisfies: [S1, S2]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/plan.py
      - packages/agent-orchestrator/tests/test_plan.py
    size: small
    difficulty: simple
  - id: T2
    delivers: >-
      A test in test_acceptance.py that rewrites an integration receipt in place, digest, tree and result kept, and
      asserts verify reports it UNKNOWN with the sha256 reason; verify.py is not changed
    satisfies: [S3]
    paths:
      - packages/agent-orchestrator/tests/test_acceptance.py
    size: small
    difficulty: simple
    risk: [security]
  - id: T3
    delivers: >-
      The driver rebuilds attention.md from the ledger's needs-you tickets on every tick instead of appending;
      test_decider.py's S13 test that pinned the append-only file is updated
    satisfies: [S4]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/test_decider.py
    size: small
    difficulty: complex
    risk: [state]
  - id: T4
    delivers: >-
      wait_checks.py and test_wait_checks.py are deleted, with a test that the module is gone; the yaml-eec narrative
      strikes D20, drops the panel and T10 lines in Migration and Risks, records S24's human acceptance and points
      D34 at its follow-up plan
    satisfies: [S5]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/wait_checks.py
      - packages/agent-orchestrator/tests/test_wait_checks.py
      - packages/agent-orchestrator/tests/test_markdown_removed.py
      - docs/plans/2026-11-10-yaml-eec.plan.md
    size: small
    difficulty: simple
