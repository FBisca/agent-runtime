schema: plan/1
slug: structure-budget
goal: >-
  Every Python file of the tree, source and test alike, is measured against five declared ceilings and
  a committed baseline, so CI fails the build when a module, a class or a function grows past the
  number recorded for it, and the orchestrator's driver is a package whose largest module is under a
  thousand lines and whose classes are under twenty-five public methods.
spec: docs/specs/python-workspace-contracts.md
domain: structure
archive: promote
outcome: [S2, S11]
scenarios:
  - id: S1
    when: the structure budget runs on a tree at its committed baseline
    then: >-
      it exits 0 and prints the five ceilings it read and how many files carry a recorded row, so a
      reader sees what is gated before seeing what is measured
  - id: S2
    when: a Python file of the tree grows past the number recorded for it
    then: >-
      it exits non-zero on one line naming that file, that metric, the measured number, the recorded
      number and the ceiling, and it names no other file, so the build fails on the growth itself
    evidence:
      check: >-
        uv run --frozen --all-packages pytest acceptance/structure/test_structure_budget_outcome.py -q
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_structure_budget_outcome.py]
      package: "."
      timeout: 600
  - id: S3
    when: a file with no recorded row exceeds a ceiling
    then: >-
      it exits non-zero naming the file, the metric and the ceiling, so a new offender cannot enter
      the tree by never having been measured
  - id: S4
    when: it runs with --write
    then: >-
      it rewrites the baseline with today's numbers and a fresh measured_at, so a deliberate change is
      recorded on purpose and the next plain run exits 0
  - id: S5
    when: the committed baseline is read
    then: >-
      it names the five ceilings (1000 module lines, 25 class public methods, 50 function lines, 12
      function branch points, 7 parameters) and carries a row only for a file that exceeds one, so a
      file under every ceiling needs no row and a new file under the ceiling is free
  - id: S6
    when: it runs with --paid on a path and one or more --metric
    then: >-
      a file under that path carrying a row for a paid metric fails naming the file and the metric
      even when the row sits under its ceiling, a row for a metric that was not paid is left alone,
      and a --paid path that matches no measured file is refused rather than passed, so a misspelt
      path cannot report a paid debt
  - id: S7
    when: CI runs the test job
    then: >-
      a step runs the structure budget over the repository with its committed baseline, beside the
      ruff, format, ty and suite-budget steps, and a growth fails the build naming the offender
  - id: S8
    when: the structure budget measures a test module and a test class
    then: >-
      it applies the same ceilings and the same recorded rows as it applies to source, so the test
      tree — twice the size of the source tree — is gated too
  - id: S9
    when: the affected tier selects tests for a change to the structure budget's script
    then: >-
      the map routes that script to its own test module rather than to the installer suite, so the
      cheap tier runs the test that proves the change
  - id: S10
    when: a published name of agent_orchestrator.driver is used by the package, the suite or an entry point
    then: >-
      it resolves, `python -m agent_orchestrator` drives the same CLI commands with the same
      arguments, and the suite's assertion that the engine has one home still names the member's
      source directory
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/tests/test_engine_home.py
        packages/agent-orchestrator/tests/test_routes_docs.py
        packages/agent-orchestrator/tests/test_orchestrate.py -q --junitxml="$EEC_JUNIT"
      baseline: pass
      timeout: 900
  - id: S11
    when: the structure budget runs with --paid on the driver package for module lines and class methods
    then: >-
      it exits 0 because no module of the driver package exceeds a thousand lines and no class of it
      carries more than twenty-five public methods, with no grandfather taken from the base and the
      flat driver module it replaced is gone
    evidence:
      check: >-
        python3 scripts/structure_budget.py --root . --baseline
        acceptance/structure/structure_budget.json --paid
        packages/agent-orchestrator/src/agent_orchestrator/driver/ --metric module-lines --metric
        class-methods
      baseline: fail
      timeout: 600
  - id: S12
    when: the orchestrator package's modules are read for a current UTC timestamp
    then: >-
      the definition exists once, in timeutil.py, and every former call site keeps the type it had: an
      ISO string where it had one and a datetime where it had one
  - id: S13
    when: the driver package is split and a ledger written before the split is read after it
    then: >-
      the record keeps its version, its kind marker and its tasks, so a ledger the old engine wrote
      opens in the new one without a migration
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_ledger.py -q --junitxml="$EEC_JUNIT"
      baseline: pass
      negative: negatives/ledger_marker_order.patch
      timeout: 600
  - id: S14
    when: the CLI is asked for its subcommands after the argument parser is decomposed
    then: >-
      it still offers the twenty command names it offered before, each command group still offers its
      subcommands, and the package entry and `python -m agent_orchestrator` reach the same `run_cli`
    evidence:
      check: >-
        uv run --frozen --all-packages pytest acceptance/structure/test_cli_surface_outcome.py -q
        --junitxml="$EEC_JUNIT"
      baseline: pass
      acceptance: [test_cli_surface_outcome.py]
      package: "."
      timeout: 600
  - id: S15
    when: the structure budget runs with --since and a file crossed a ceiling it was under at that revision
    then: >-
      it exits non-zero naming the file, the metric, the measured number and the ceiling, so a ceiling
      that is crossed fails even when nothing was recorded about that file before
  - id: S16
    when: a file that was already over a ceiling at --since grows past the number it had there
    then: >-
      it exits non-zero naming the file, the metric, the measured number, its number at that revision
      and the ceiling, so an offender may only shrink
  - id: S17
    when: a file grows but stays under every ceiling
    then: >-
      it exits 0, so growth under a ceiling is free and the committed file holds the ceilings and
      nothing about any file
  - id: S18
    when: the whole suite's junit is measured
    then: >-
      a test over eighteen seconds fails naming the test, its seconds and the ceiling, the suite's
      summed call time is held to the single ceiling the committed budget names, and the budget
      carries those two ceilings with no per-module row and no tolerance machinery
  - id: S19
    when: a file that is over a ceiling is moved and keeps its content
    then: >-
      it keeps the number it had at --since, so a move on its own never fails the build and the only
      way out of a ceiling is to get smaller
    evidence:
      check: >-
        uv run --frozen --all-packages pytest acceptance/structure/test_structure_budget_outcome.py -q
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_structure_budget_outcome.py]
      package: "."
      timeout: 600
  - id: S20
    when: a linter rule is weighed against one of the budget's five metrics
    then: >-
      the rule is not substituted for the metric unless it counts the same thing, and where it
      nearly does the divergence is pinned by a test: branch points, argument counts and public
      methods stay the gate's own counts, so a rule that counts dunder methods as public or skips a
      comprehension filter cannot quietly replace them

  - id: S23
    when: an untracked or ignored directory sits inside the checkout, such as a nested worktree
    then: >-
      the plan check and the structure budget read what git tracks, so a copy of a plan folder cannot
      make the plan unloadable and a nested checkout cannot be measured as part of the package, and
      outside a repository the walk still measures the tree it is given
  - id: S22
    when: the driver package is split into modules behind its facade
    then: >-
      every public name the package's modules define is still reachable as driver.<name>, asserted by a
      test that compares the two sets rather than by a reading, so a split cannot drop a name and still
      pass because nothing happened to import it yet
  - id: S24
    when: a unit is re-dispatched and its second attempt is reviewed
    then: >-
      the reviewer's packet names the exact report of the attempt under review, with its mtime and the
      head it claims, rather than a glob over the unit directory, and the trail's newest report is
      chosen by an order the record holds rather than by dictionary order, so a stale file cannot be
      read as the change under review
