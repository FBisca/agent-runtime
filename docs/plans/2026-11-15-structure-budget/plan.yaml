      PLR0904 are compared against the gate's three counters on this tree, and a test pins the
      divergence so the swap cannot be tried again in silence - twenty files the gate counts over the
      branch ceiling measure under ruff's twelve, and two driver classes it counts at twenty-five
      measure twenty-six because ruff counts dunder methods as public. Every threshold keeps one
      implementation, the gate's own, and the spec says which measures what.
