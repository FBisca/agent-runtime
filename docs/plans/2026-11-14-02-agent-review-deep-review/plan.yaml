schema: plan/1
slug: 02-agent-review-deep-review
goal: >-
  A screening escalation runs one safe, read-only agent-runtime spawned
  reviewer that produces structured, evidence-backed findings or an explicit
  incomplete outcome.
spec: docs/specs/agent-review.md
domain: deep-review
archive: discard
outcome: [S1, S2, S3, S4, S5, S6]
scenarios:
  - id: S1
    when: >-
      a screening signal fires — a value beyond its calibrated threshold, or a
      confidence below its band
    then: >-
      one spawned deep reviewer investigates flagged areas using matching
      specialized review instructions
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/deep-review/test_deep_review.py
        -q -k "S1"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_deep_review.py]
      package: packages/agent-review
      timeout: 600
  - id: S2
    when: >-
      a critical safeguard, sensitive path, or insufficient cross-file context
      triggers escalation
    then: >-
      the spawned reviewer conducts a full review rather than a focused review
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/deep-review/test_deep_review.py
        -q -k "S2"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_deep_review.py]
      package: packages/agent-review
      timeout: 600
  - id: S3
    when: >-
      the selected harness cannot enforce read/search-only capabilities or
      prohibit command/test execution
    then: >-
      the review fails safely and never spawns an unrestricted reviewer
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/deep-review/test_deep_review.py
        -q -k "S3"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_deep_review.py]
      package: packages/agent-review
      timeout: 600
  - id: S4
    when: >-
      the deep reviewer confirms or dismisses screening signals
    then: >-
      each critical/high signal receives an individually evidenced disposition
      carrying the score, the confidence and the threshold that fired,
      advisory signals may be grouped, and mandatory-contract violations
      cannot be downgraded
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/deep-review/test_deep_review.py
        -q -k "S4"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_deep_review.py]
      package: packages/agent-review
      timeout: 600
  - id: S5
    when: >-
      deep review times out, returns invalid output, or fails
    then: >-
      execution is incomplete with retained valid evidence and no automatic
      retry or model fallback
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/deep-review/test_deep_review.py
        -q -k "S5"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_deep_review.py]
      package: packages/agent-review
      timeout: 600
  - id: S6
    when: >-
      no escalation is required or a deep review completes cleanly
    then: >-
      the resulting verdict distinguishes `screened` from `passed`
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-review/acceptance/deep-review/test_deep_review.py
        -q -k "S6"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_deep_review.py]
      package: packages/agent-review
      timeout: 600
tickets:
  - id: T1
    delivers: >-
      Spawn one read-only reviewer for an escalated change: the harness
      family's read/search-only capability is answered by agent-runtime for
      every family it knows, and a harness that cannot enforce it is refused
      before anything runs, while the review's scope (focused or full) and its
      composed specialized instructions follow the reasons that fired
    satisfies: [S1, S2, S3]
    paths: [packages/agent-review/, packages/agent-runtime/]
    size: regular
    difficulty: complex
    risk: [security, external]
  - id: T2
    delivers: >-
      Turn the reviewer's answer into structured findings and individually
      evidenced dispositions, keep a confirmed mandatory-contract violation
      blocking, and record an incomplete review that is never retried or
      fallen back from, with the verdict telling screened from passed
    satisfies: [S4, S5, S6]
    paths: [packages/agent-review/]
    blocked_by: [T1]
    size: regular
    difficulty: complex
    risk: [state]
approval:
