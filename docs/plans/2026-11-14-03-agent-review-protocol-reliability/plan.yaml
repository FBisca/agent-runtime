schema: plan/1
archive: discard
slug: 03-agent-review-protocol-reliability
goal: A caller can observe review progress and safely archive complete or interrupted review results without changing
  the live orchestrator.
outcome:
- S1
- S2
- S3
scenarios:
- id: S1
  when: a caller starts a review through the CLI or optional JSON-RPC 2.0 stdio mode
  then: both interfaces provide consistent outcomes, with milestone notifications in RPC mode
  evidence:
    human: Run the same frozen review through CLI and optional JSON-RPC stdio. Verify milestones (screening, applicability,
      escalation, deep review, findings, completion), correlated final result, and consistent verdict.
- id: S2
  when: a review is interrupted or partially completes
  then: minimal lifecycle state and completed screening judgments survive, and the final JSON report is written
    atomically when available
  evidence:
    human: Interrupt a review after screening. Inspect saved lifecycle state and screening judgments; confirm incomplete
      is not passed. Complete a run and check atomic final JSON publication and optional JSONL trace.
- id: S3
  when: an execution completes with blocking findings
  then: the CLI exit code indicates execution health, while the structured verdict remains `blocked`
  evidence:
    human: Run a review with blocking findings; assert CLI exits 0 when execution completed and report verdict is
      blocked. Assert nonzero for execution failure.
tickets:
- id: T1
  delivers: Add optional JSON-RPC 2.0 stdio milestone notifications and CLI/RPC consistent execution/verdict semantics,
    plus caller-selected output directory and minimal atomic persistence
  satisfies:
  - S1
  - S2
  - S3
  paths:
  - packages/agent-review/
  size: regular
  difficulty: complex
  risk:
  - state
  evidence_waiver: Verify CLI/RPC semantic parity, milestone notifications, atomic output and interrupted-run persistence
    through targeted black-box runs; record commands/results.
