schema: plan/1
slug: agent-eval-named-capture
goal: >-
  A session of any harness — Claude, Codex or Pi — can be captured by
  name, and every captured session records its own cwd and assignment
  id, whichever road it entered the case by, so a run on any harness is
  judged from the same evidence as a Claude one.
spec: docs/specs/agent-eval.md
outcome: [S5]

scenarios:
  # T1: name a session of any harness
  - id: S1
    when: "`agent-eval capture --session <id>` names a Codex or Pi session"
    then: >-
      the case holds that session's transcript (with its later rollout
      files, for Codex), and the manifest lists it with its harness
      (`codex` or `pi`), the cwd of its first record, its role and
      parent, and no subagent entry and no aux file of its own
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-eval/tests/test_capture_named_outcome.py -m integration
        -k "NamedSessionTests or ControlTests" -q --junitxml="$EEC_JUNIT"
      oracle: [test_capture_named_outcome.py.oracle]
      place: packages/agent-eval/tests/
      baseline: fail
      timeout: 300
  - id: S2
    when: >-
      the `--session` ref matches no session, several sessions in one
      harness, or the same session under two harnesses
    then: >-
      capture exits 2 and writes nothing: an unknown ref names the
      directory it looked in for each harness, an ambiguous one names
      every candidate with its harness, and a session found under two
      harnesses names the two places it was found
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-eval/tests/test_capture_named_outcome.py -m integration
        -k "RefusalTests or ControlTests" -q --junitxml="$EEC_JUNIT"
      oracle: [test_capture_named_outcome.py.oracle]
      place: packages/agent-eval/tests/
      baseline: fail
      timeout: 300
  - id: S3
    when: >-
      `--session` names a Codex or Pi session, alone or beside another
      `--session`, with or without a run
    then: >-
      the first `--session`'s session is the `root` and names the default
      case, whatever the other sessions' age, a later one has role
      `session`, a named session that is also a worker of the run joins
      once, keeping the role the naming gave it, and `--exclude` leaves
      a named session out and lists it
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-eval/tests/test_capture_named_outcome.py -m integration
        -k "RootTests or ControlTests" -q --junitxml="$EEC_JUNIT"
      oracle: [test_capture_named_outcome.py.oracle]
      place: packages/agent-eval/tests/
      baseline: fail
      timeout: 300

  # T1: the manifest's own fields, on every road
  - id: S4
    when: "a session is captured, whichever road it entered the case by"
    then: >-
      the manifest records its `cwd` and its `assignment_id` when its own
      first prompt carries one, and null when it does not; the same
      session captured by name and as a worker of a run records the same
      two fields
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-eval/tests/test_capture_named_outcome.py -m integration
        -k "ManifestFieldTests or ControlTests" -q --junitxml="$EEC_JUNIT"
      oracle: [test_capture_named_outcome.py.oracle]
      place: packages/agent-eval/tests/
      baseline: fail
      timeout: 300

  # Outcome (T2, a person)
  - id: S5
    when: "the four Pi sessions of the 2026-11-10 batch are captured by name"
    then: >-
      each case holds the session's whole transcript with its harness
      `pi`, the cwd of its first record and role `root`
    evidence:
      human: >-
        Felippe runs `agent-eval capture --session <id>` for the four Pi
        sessions of the batch, by their full ids (01a1c5f4-da75-77ff-
        8635-e123ced4e441, 01a1c585-db9a-77ff-8635-e120d4152ce3,
        01a1c60b-14c6-738c-94bc-68202792b3a3, 01a1c614-f843-764d-8d5c-
        cb121607c683), and confirms each case holds the session's whole
        transcript, harness `pi`, the session's own cwd and role `root`

tickets:
  - id: T1
    delivers: >-
      `--session` resolves against Claude, Codex and Pi: a named Codex or
      Pi session joins the case with its harness, cwd, transcript and
      rollouts; the root and role rules hold; a ref that matches nothing
      or several sessions is refused with exit 2 naming the candidates
      and the harnesses looked in; and every captured session records its
      own cwd and assignment id, whichever road it came in by. The
      requirements R228 and R229, their Coverage rows, the spec's
      case-layout prose and the `capture --help` text land with it.
    satisfies: [S1, S2, S3, S4]
    paths:
      - packages/agent-eval/src/agent_eval/capture.py
      - packages/agent-eval/src/agent_eval/sessions.py
      - packages/agent-eval/src/agent_eval/cli.py
      - packages/agent-eval/tests/test_capture_named.py
      - docs/specs/agent-eval.md
    size: regular
    difficulty: simple
    risk: [security, state]
  - id: T2
    delivers: >-
      The four Pi sessions of the 2026-11-10 batch are captured by name
      and the cases are checked against S5 (writes under
      ~/.local/state/agent-evals only; changes no repo file)
    satisfies: [S5]
    blocked_by: [T1]
    paths:
      - docs/specs/agent-eval.md
    owner: Felippe
