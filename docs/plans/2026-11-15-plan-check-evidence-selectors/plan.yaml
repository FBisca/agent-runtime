schema: plan/1
slug: plan-check-evidence-selectors
goal: >-
  `plan check`, `plan approve` and `plan amend` refuse a folder plan whose pytest `-k` evidence does not select its
  own scenario's tests, and only them, from the plan's acceptance files, so a check can no longer pass on tests not
  yet written or run another scenario's test by substring.
spec: docs/specs/orchestrator-engine.md
domain: plan
archive: discard
outcome: [S1]
scenarios:
  - id: S1
    when: >-
      a folder plan's scenario carries `check` evidence that runs pytest with a `-k` selector of `or`-joined terms
      over the files named in its `evidence.acceptance`
    then: >-
      the lint refuses, naming the scenario and the way out (the anchored selector `-k "test_<id>_ or
      test_control_"`), when the selector does not name the scenario's own id, selects no test in those files but
      controls, or selects a test whose name carries a scenario id it did not name; an anchored selector stays
      valid, and a check without `-k` and a legacy plan are not linted
    evidence:
      check: >-
        uv run --frozen --all-packages pytest
        packages/agent-orchestrator/acceptance/plan/test_evidence_selectors.py -q -k "test_S1_ or test_control_"
        --junitxml="$EEC_JUNIT"
      baseline: fail
      acceptance: [test_evidence_selectors.py]
      package: packages/agent-orchestrator
      timeout: 600
tickets:
  - id: T1
    delivers: >-
      The selector lint in `lint_problems`: read the acceptance files with `ast`, model `-k` as `or`-joined
      case-insensitive substring terms, refuse the three cases naming the scenario and the anchored selector, and
      record the requirement in the living spec
    satisfies: [S1]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/plan.py
      - packages/agent-orchestrator/tests/test_plan_check_selectors.py
      - docs/specs/orchestrator-engine.md
    size: small
    difficulty: simple
