schema: plan/1
slug: deterministic-archive
goal: >-
  An accepted plan archives in seconds plus CI with no agent: the driver itself writes the spec section, copies the
  plan files, places the oracles and opens the archive PR, and the advisory gaps reviewer starts only once that PR
  has merged.
spec: docs/specs/plan-contract.md
outcome: [S1, S2, S6]

scenarios:
  - id: S1
    when: every agent ticket of an ACCEPTED or ACCEPTED_WITH_HUMAN YAML plan is COMPLETE
    then: >-
      the driver spawns no archive agent: in the archive worktree it places each promote oracle and copies plan.yaml,
      its narrative and its oracle directory byte-identical, writes the spec section (S2), commits on
      `feat/<slug>-archive`, pushes it and runs `gh pr create`, whose printed url becomes the archive unit's PR; the
      unit then takes the outcome evidence re-run, CI and the merge as today, and the plan is ARCHIVED on merge
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_deterministic_archive.py
        -m integration -k NoAgentArchive -q --junitxml="$EEC_JUNIT"
      oracle: [test_deterministic_archive.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 600
  - id: S2
    when: the driver writes the archive's spec section
    then: >-
      the plan's `spec` keeps its text unchanged and gains one appended section: `## Requirements: <slug>` with
      `- **R<n>** WHEN <when>, THEN <then> (from <slug>/<id>)` for each scenario the spec does not already hold,
      numbered from the highest `R<n>` in that file plus one (omitted when it holds every scenario), then
      `## Coverage: <slug>` with `| Requirement | Scenario | Test nodes |` and one row per scenario, its nodes the
      union of the tickets' `covers` for it followed by its placed oracle paths, joined by `<br>`; a held scenario
      keeps its existing number; a spec file that does not exist is created holding the section alone
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_deterministic_archive.py
        -m integration -k SpecSection -q --junitxml="$EEC_JUNIT"
      oracle: [test_deterministic_archive.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 600
  - id: S3
    when: a scenario of the archived plan has `human` evidence
    then: 'its Coverage row reads `human: <the evidence text>` and needs no test node'
  - id: S4
    when: a scenario without `human` evidence has no node in any ticket's `covers` and no placed oracle
    then: >-
      the driver opens no PR and asks the Lead, naming each such scenario and the way out (`retry` once a node is
      added to a ticket report's `covers`, or `skip` and archive by hand); the request's menu is `retry` and `skip`
  - id: S5
    when: the outcome evidence fails on the archive head, or the archive PR conflicts with its base
    then: >-
      no worker is spawned: the driver asks the Lead naming the cause, with the menu `retry` and `skip`; `retry`
      rebuilds the archive branch from the current base and pushes it again, `skip` releases the unit
  - id: S6
    when: the archive PR merges
    then: >-
      only then does the driver spawn the advisory gaps reviewer, and the run ends without waiting for its report;
      before the archive merges no gaps reviewer exists
    evidence:
      check: >-
        uv run --frozen --all-packages pytest packages/agent-orchestrator/tests/test_deterministic_archive.py
        -m integration -k GapsAfterArchive -q --junitxml="$EEC_JUNIT"
      oracle: [test_deterministic_archive.py.oracle]
      place: packages/agent-orchestrator/tests/
      baseline: fail
      timeout: 600
  - id: S7
    when: a route config or a `--route` override names the `archive` step
    then: >-
      the driver refuses before any spawn, naming the step and the fix (the archive has no agent: remove the
      `archive` route); the `implementer`, `reviewer` and `gaps` step routes work as today

tickets:
  - id: T1
    delivers: >-
      The driver archives with no agent: oracles placed, plan files copied, spec section appended, commit, push and
      `gh pr create`, a driver-written report carrying the PR; a Lead request (retry, skip) replaces the archive fix
      and conflict rounds; the `archive` step route is refused; fake gh answers `pr create`; the archive tests move
      off the scripted archive worker, keeping the names the outcome oracle imports (`ArchiveFixture`,
      `ticket_merged`, `ARCHIVE`, `commit_spec`); plan-contract R25/R29 and orchestrator-engine R9/R11 say the driver
      archives
    satisfies: [S1, S2, S3, S4, S5, S7]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/src/agent_orchestrator/contracts.py
      - packages/agent-orchestrator/src/agent_orchestrator/routes.py
      - packages/agent-orchestrator/tests/
      - docs/specs/plan-contract.md
      - docs/specs/orchestrator-engine.md
    size: regular
    difficulty: complex
    risk: [state]
  - id: T2
    delivers: >-
      The gaps reviewer is spawned when the archive unit merges, not beside it, and the run's end no longer waits
      for it (its own test holds a gaps assignment open in the runtime and asserts the run still ends); the tests
      that scripted a gaps report beside the archive drop it; orchestrator-engine says when gaps starts
    satisfies: [S6]
    paths:
      - packages/agent-orchestrator/src/agent_orchestrator/driver.py
      - packages/agent-orchestrator/tests/
      - docs/specs/orchestrator-engine.md
    size: small
    difficulty: simple
    blocked_by: [T1]
