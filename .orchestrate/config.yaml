# The repo's plan engine config: where plans live, where promoted acceptance tests go, how a plan archives.
plans:
  dir: docs/plans
acceptance:
  dir: acceptance
archive:
  mode: promote
# The check tiers: a worker runs the cheap two, verify and CI run the whole suite once.
checks:
  fast: uv run pytest
  affected: uv run pytest --impacted --impacted-git-mode=branch --impacted-base-branch={base}
  full:
    run: uv run pytest -n auto
