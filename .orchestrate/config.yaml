# The repo's plan engine config: where plans live and how a plan archives.
plans:
  dir: docs/plans
archive:
  mode: promote
# The rulebook: implementers follow it and reviewers judge against it.
rulebook: docs/rulebook.md
# The check tiers: a worker runs the cheap two, CI runs the whole suite.
checks:
  fast: uv run pytest
  affected: uv run pytest --impacted --impacted-git-mode=branch --impacted-base-branch={base}
  full:
    run: uv run --frozen --all-packages pytest -n auto
