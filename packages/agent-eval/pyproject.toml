[project]
name = "agent-eval"
version = "0.1.0"
description = "Freeze a coding-agent run into a local, immutable case; read-only on the harnesses' files."
requires-python = ">=3.11"
# Standard library only: the capture reads orchestrator, runtime and harness files and needs no
# dependency of the other members.
dependencies = []

[project.scripts]
agent-eval = "agent_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_eval"]
