# The curated global question bank (D04, D49): the sixteen engineering
# principles the owner supplied, and the contract questions a review asks of
# any change. A repository's configuration extends this bank and never
# overrides or disables it (D05); an invocation without --config evaluates
# exactly these questions.
#
# A judgment is native and bounded (D44, D50): a question is answered with the
# probability that the change satisfies it (a `noul`) or with a position on a
# ladder of levels (a `score`). Priority is declared here and never chosen by
# the screening model (D07); a critical question is always asked (D09). Ids are
# stable and unique: a question whose meaning changes takes a new id, so a
# frozen report stays comparable (D26, D51). Expand the bank only after
# evidence of a gap (D49).
#
# VERSION BREAK (D26): `contract.error-handling` keeps its id but changes
# instrument from this version on. It was a noul - the probability that the
# change satisfies the question, higher is better - and is now a score on a
# five-level severity ladder, lower is better, whose levels are listed on the
# question. A frozen judgment recorded under the old instrument is therefore
# not comparable with one from this bank: read a benchmark across this change as
# two versions, never as one series. A noul probability for the same question
# can be asked again only under a new id.

model: jev-latest

# The numbers this bank is screened and decided with, declared here and never
# chosen by the model (D07, D48). A repository's configuration lays its own
# weights and thresholds over these per question, so naming one question
# recalibrates that question and leaves the rest calibrated.
#
# `weights`: what a question weighs when the signals are aggregated. A question
# no configuration weighs carries the default, 1, so this block names only the
# questions that weigh more.
weights: {}

# `thresholds`: the value a question's answer must clear and the confidence
# band it must keep, calibrated on the reference set the Jev evidence froze
# (2026-11-15-agent-review-jev-evidence/CALIBRATION.md, SCORES.md). A noul is
# escalated when its probability falls below `value`; a score, whose ladder
# runs from no violation to the worst, when its position rises above it. A
# question no calibration moved carries no threshold: a number nothing
# separates would escalate on noise, so it is recorded and never escalated
# alone.
thresholds:
  # score 0-4, clean 0.23 / bad 0.67 on the 0-4 scale; router B's operating
  # point on the same 12 cases (escalate at severity >= 1.5 or confidence 0.7).
  contract.error-handling:
    value: 1.5
    confidence: 0.7
  # noul, clean 0.82 / bad 0.69; the midpoint of the two means.
  contract.requirement-traceability:
    value: 0.75
  # noul, clean 0.77 / bad 0.66.
  contract.test-evidence:
    value: 0.71
  # noul, clean 0.79 / bad 0.68.
  engineering.survival-priority:
    value: 0.73
  # noul, clean 0.69 / bad 0.52.
  engineering.hidden-state:
    value: 0.6
  # noul, clean 0.61 / bad 0.46.
  engineering.abstraction-levels:
    value: 0.53

# The mandatory protected-path baseline (D13): a change that reaches one
# of these paths escalates to a person whatever the repository configures. A
# repository's own `.agent-review.yaml` adds to this list and never replaces
# it. Patterns are matched from the repository root: `**` crosses directories,
# `*` and `?` stay within one, and a pattern with no glob names that one path.
sensitive_paths:
  - .github/workflows/**
  - server/**
  - hooks/**
  - pyproject.toml
  - uv.lock

questions:
  # The contract perspective: what this repository promised its callers.
  - id: contract.requirement-traceability
    priority: critical
    ask: >-
      Does every behaviour this change alters trace to a stated requirement or
      a stated cause
  - id: contract.error-handling
    priority: critical
    type: score
    criteria:
      - no new failure path, or every one raises an actionable error
      - a new failure's error is vague but actionable
      - a new failure is handled by a caller-visible fallback with no signal
      - a new failure is swallowed or replaced by a silent default
      - a new failure crashes, or reports success while the operation failed
    ask: >-
      How severely does the change violate error handling: does every new
      failure at a boundary surface an error a caller can act on, rather than
      a silent fallback
  - id: contract.public-surface-compatibility
    priority: high
    ask: >-
      Does the change keep the public surface its callers already rely on
      (flags, exit codes, file formats, schemas) compatible
  - id: contract.test-evidence
    priority: high
    ask: Would a test fail without this change, for each behaviour it alters
  - id: contract.missing-context
    priority: advisory
    ask: >-
      Does the change state the context it could not see, rather than treat an
      unknown as satisfied

  # The engineering perspective: the owner's sixteen principles, one question
  # each. The ask names the principle; a judgment is still evidence-bound.
  - id: engineering.survival-priority
    priority: critical
    ask: >-
      Does the change keep the running system available and correct, including
      through its own failure modes
  - id: engineering.traceable-cause
    priority: high
    ask: >-
      Can every behaviour the change introduces be traced to its cause without
      guessing
  - id: engineering.durable-intent
    priority: high
    ask: >-
      Does the change record why the behaviour exists, in a form that outlives
      the author
  - id: engineering.external-legibility
    priority: high
    ask: >-
      Can the change's internal state be read from outside it, through an
      observable signal rather than a log line
  - id: engineering.type-contracts
    priority: high
    ask: >-
      Do the declared types constrain what the code accepts and returns, rather
      than merely annotate it
  - id: engineering.implicit-named
    priority: advisory
    ask: >-
      Does the change name the assumption it depends on instead of leaving it
      implicit
  - id: engineering.understand-before-compressing
    priority: high
    ask: >-
      Is the logic understood at its own level, rather than compressed into an
      expression whose behaviour must be unpacked
  - id: engineering.hard-decisions
    priority: advisory
    ask: >-
      Does the change make the hard decision it cannot avoid, rather than defer
      it to a caller or a later phase
  - id: engineering.elegance
    priority: advisory
    ask: >-
      Is the change shaped like the problem it solves, without incidental
      complexity
  - id: engineering.new-concepts
    priority: advisory
    ask: Does every concept the change introduces earn its keep
  - id: engineering.hidden-state
    priority: high
    ask: >-
      Does the change avoid accumulating hidden state, especially logic that
      branches on three or more booleans
  - id: engineering.names-meaning
    priority: advisory
    ask: >-
      Do the new names say what they mean rather than how they are implemented
  - id: engineering.abstraction-levels
    priority: advisory
    ask: >-
      Does each unit of the change keep to one level of abstraction, so that it
      reads as one thing
  - id: engineering.composition
    priority: advisory
    ask: >-
      Does the change compose what already exists rather than create another
      mechanism for it
  - id: engineering.consequence-not-achievement
    priority: advisory
    ask: >-
      Is a one-liner present because it follows from the problem, not as an
      achievement in itself
  - id: engineering.threshold
    priority: advisory
    ask: >-
      Does the change state the threshold it is good enough for, rather than
      treat better as a direction
