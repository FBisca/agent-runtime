[project]
name = "agent-runtime"
version = "0.1.0"
description = "The local runtime that gives a lead its workers: one team, one lead, many CLIs."
requires-python = ">=3.11"
# The runtime is standard-library-only in production: no orchestrator dependency may leak in here.
dependencies = []

[project.scripts]
agent-runtime = "agent_runtime.agent_runtime:main"
agent-runtime-mcp = "agent_runtime.mcp_server:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The runtime sources live in the member; the wheel ships them as the `agent_runtime` package.
packages = ["src/agent_runtime"]
