[project]
name = "agent-runtime"
version = "0.1.0"
description = "The local runtime that gives a lead its workers: one team, one lead, many CLIs."
requires-python = ">=3.11"
# The runtime is standard-library-only in production: no orchestrator dependency may leak in here.
dependencies = []

[project.scripts]
agent-runtime = "agent_runtime:main"
agent-runtime-mcp = "mcp_server:serve"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The runtime sources stay where they are until the migration ticket moves them; the wheel ships
# them as flat modules, exactly as the command shims import them today.
packages = []

[tool.hatch.build.targets.wheel.force-include]
"../../server/agent_runtime.py" = "agent_runtime.py"
"../../server/dispatch_events.py" = "dispatch_events.py"
"../../server/dispatch_store.py" = "dispatch_store.py"
"../../server/dispatch_wait.py" = "dispatch_wait.py"
"../../server/hc_tools.py" = "hc_tools.py"
"../../server/host_policy.py" = "host_policy.py"
"../../server/markers.json" = "markers.json"
"../../server/mcp_server.py" = "mcp_server.py"
"../../server/profiles.py" = "profiles.py"
"../../server/usage.py" = "usage.py"
