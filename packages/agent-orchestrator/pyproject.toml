[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "The typed orchestration engine: Pydantic contracts over YAML policy."
requires-python = ">=3.11"
# Orchestrator-only dependencies: the runtime wheel must never need them.
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The engine moves in with the migration ticket; the member exists so the workspace resolves both
# packages and so the runtime isolation is provable before any orchestrator code ships.
include = ["src/agent_orchestrator/**/*.py"]
