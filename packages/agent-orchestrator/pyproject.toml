[project]
name = "agent-orchestrator"
version = "0.1.0"
description = "The typed orchestration engine: Pydantic contracts over YAML policy."
requires-python = ">=3.11"
# Orchestrator-only dependencies: the runtime wheel must never need them.
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.scripts]
agent-orchestrator = "agent_orchestrator.driver:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The engine lives in the member; the wheel ships it as the `agent_orchestrator` package.
packages = ["src/agent_orchestrator"]
